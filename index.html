<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음성 인식 AI 비서</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #334155;
            color: #94a3b8;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .status-badge.active {
            background: #0284c7;
            color: #ffffff;
        }
        .mic-btn-wrapper {
            margin: 20px 0;
        }
        .mic-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            background: #0284c7;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
        }
        .mic-btn:hover {
            transform: scale(1.05);
            background: #0369a1;
        }
        .mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            min-height: 50px;
            word-break: break-all;
        }
        .box-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .box-text {
            font-size: 1rem;
            color: #f1f5f9;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 AI 음성 인식 대화</h1>
        <div id="statusBadge" class="status-badge">버튼을 눌러 대화를 시작하세요</div>
        
        <div class="mic-btn-wrapper">
            <button id="voiceBtn" class="mic-btn" aria-label="마이크 버튼">🎤</button>
        </div>

        <div>
            <div class="box-label">내가 한 말</div>
            <div class="box">
                <div id="userInput" class="box-text">대기 중...</div>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <div class="box-label">AI의 대답</div>
            <div class="box">
                <div id="aiResponse" class="box-text">음성을 인식하면 이곳에 대답이 표시됩니다.</div>
            </div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('statusBadge').innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
            alert("Chrome 또는 Edge 브라우저에서 실행해 주세요.");
        } else {
            const recognition = new SpeechRecognition();
            const voiceBtn = document.getElementById('voiceBtn');
            const statusBadge = document.getElementById('statusBadge');
            const userInput = document.getElementById('userInput');
            const aiResponse = document.getElementById('aiResponse');

            let isListening = false;

            // 음성 인식 설정
            recognition.lang = 'ko-KR';
            recognition.continuous = false; // 브라우저 멈춤 방지를 위한 단구절 수신 모드
            recognition.interimResults = true; // 말하는 중간 텍스트 실시간 반영

            // 마이크 버튼 클릭 이벤트
            voiceBtn.addEventListener('click', () => {
                if (!isListening) {
                    startListening();
                } else {
                    stopListening();
                }
            });

            function startListening() {
                try {
                    window.speechSynthesis.cancel(); // 이전 AI 오디오 즉시 중단
                    recognition.start();
                } catch (e) {
                    console.error("인식 시작 예외 처리:", e);
                }
            }

            function stopListening() {
                isListening = false;
                try {
                    recognition.stop();
                } catch (e) {
                    console.error("인식 중지 예외 처리:", e);
                }
                resetUI();
            }

            // 음성 인식 시작 시 이벤트
            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerText = '⏹️';
                statusBadge.classList.add('active');
                statusBadge.innerText = '음성을 듣고 있습니다...';
                userInput.innerText = '듣는 중...';
            };

            // 실시간 인식 결과 수신
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                userInput.innerText = transcript;

                // 최종 문장 수신 완료 시 처리
                if (event.results[event.results.length - 1].isFinal) {
                    const finalQuery = transcript.trim();
                    if (finalQuery.length > 0) {
                        processQueryAndRespond(finalQuery);
                    }
                    stopListening();
                }
            };

            // 에러 처리
            recognition.onerror = (event) => {
                console.error('음성 인식 오류 발생:', event.error);
                if (event.error === 'not-allowed') {
                    alert('마이크 접근 권한이 필요합니다. 주소창 왼쪽 설정에서 마이크를 허용해주세요.');
                } else if (event.error === 'no-speech') {
                    statusBadge.innerText = '음성이 감지되지 않았습니다. 다시 눌러주세요.';
                }
                resetUI();
            };

            // 인식 종료 이벤트
            recognition.onend = () => {
                resetUI();
            };

            function resetUI() {
                isListening = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.innerText = '🎤';
                statusBadge.classList.remove('active');
                if (statusBadge.innerText === '음성을 듣고 있습니다...') {
                    statusBadge.innerText = '버튼을 눌러 대화를 시작하세요';
                }
            }

            // AI 대답 생성 logic & TTS 음성 재생
            function processQueryAndRespond(query) {
                let reply = `'${query}'라고 말씀하셨군요! 대화를 계속 이어가보세요.`;

                if (query.includes('안녕')) {
                    reply = '안녕하세요! 만나서 반갑습니다. 무엇을 도와드릴까요?';
                } else if (query.includes('이름')) {
                    reply = '저는 웹 브라우저에서 동작하는 AI 음성 비서입니다.';
                } else if (query.includes('시간') || query.includes('시')) {
                    const now = new Date();
                    reply = `현재 시각은 ${now.getHours()}시 ${now.getMinutes()}분입니다.`;
                } else if (query.includes('날씨')) {
                    reply = '오늘 날씨는 맑고 따뜻할 것으로 예상됩니다.';
                }

                aiResponse.innerText = reply;
                speak(reply);
            }

            // 음성 출력 (TTS)
            function speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 1.0;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
