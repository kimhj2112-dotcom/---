<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 모델 선택 음성 비서</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: 15px; color: #38bdf8; }
        
        /* 모델 선택 및 설정 스타일 */
        .setting-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
            border: 1px solid #334155;
        }
        label { font-size: 0.8rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 5px; }
        select, input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            background: #334155;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .status-badge.active { background: #0284c7; color: #ffffff; }

        .mic-btn-wrapper { margin: 15px 0; }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: #0284c7;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            text-align: left;
            min-height: 45px;
        }
        .box-label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
        .box-text { font-size: 0.95rem; color: #f1f5f9; line-height: 1.4; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AI 멀티 모델 음성 비서</h1>

        <!-- AI 모델 및 API 키 설정 -->
        <div class="setting-box">
            <label for="modelSelect">AI 모델 선택</label>
            <select id="modelSelect">
                <option value="gemini">Google Gemini 1.5 Flash</option>
                <option value="chatgpt">OpenAI ChatGPT (GPT-4o-mini)</option>
            </select>

            <label for="apiKey">API Key (선택 사항)</label>
            <input type="password" id="apiKey" placeholder="입력 시 실제 AI API와 연동됩니다">
        </div>

        <div id="statusBadge" class="status-badge">버튼을 눌러 대화를 시작하세요</div>

        <div class="mic-btn-wrapper">
            <button id="voiceBtn" class="mic-btn">🎤</button>
        </div>

        <div>
            <div class="box-label">내가 한 말</div>
            <div class="box"><div id="userInput" class="box-text">대기 중...</div></div>
        </div>

        <div style="margin-top: 10px;">
            <div class="box-label">AI 대답</div>
            <div class="box"><div id="aiResponse" class="box-text">음성을 인식하면 선택한 AI 모델이 대답합니다.</div></div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Chrome 또는 Edge 브라우저에서 실행해주세요.");
        } else {
            const recognition = new SpeechRecognition();
            const voiceBtn = document.getElementById('voiceBtn');
            const statusBadge = document.getElementById('statusBadge');
            const userInput = document.getElementById('userInput');
            const aiResponse = document.getElementById('aiResponse');
            const modelSelect = document.getElementById('modelSelect');
            const apiKeyInput = document.getElementById('apiKey');

            let isListening = false;

            recognition.lang = 'ko-KR';
            recognition.continuous = false;
            recognition.interimResults = true;

            voiceBtn.addEventListener('click', () => {
                if (!isListening) {
                    try {
                        window.speechSynthesis.cancel();
                        recognition.start();
                    } catch (e) { console.error(e); }
                } else {
                    stopListening();
                }
            });

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerText = '⏹️';
                statusBadge.classList.add('active');
                statusBadge.innerText = '듣고 있습니다...';
                userInput.innerText = '듣는 중...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.innerText = transcript;

                if (event.results[event.results.length - 1].isFinal) {
                    const query = transcript.trim();
                    if (query) {
                        handleAIQuery(query);
                    }
                    stopListening();
                }
            };

            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();

            function stopListening() {
                isListening = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.innerText = '🎤';
                statusBadge.classList.remove('active');
                statusBadge.innerText = '버튼을 눌러 대화를 시작하세요';
            }

            // 모델별 처리 및 API 요청
            async function handleAIQuery(query) {
                const selectedModel = modelSelect.value;
                const apiKey = apiKeyInput.value.trim();

                aiResponse.innerText = "생각하는 중...";

                let reply = "";

                if (apiKey) {
                    // API Key가 있을 경우 실제 LLM 호출
                    try {
                        if (selectedModel === 'gemini') {
                            reply = await fetchGeminiResponse(query, apiKey);
                        } else {
                            reply = await fetchChatGPTResponse(query, apiKey);
                        }
                    } catch (err) {
                        reply = "API 호출 중 오류가 발생했습니다. API 키를 확인해주세요.";
                    }
                } else {
                    // API Key가 없을 경우 시뮬레이션 응답
                    if (selectedModel === 'gemini') {
                        reply = `[Gemini] "${query}"에 대한 대답입니다. Google Gemini 모델로 연결하려면 API 키를 입력하세요.`;
                    } else {
                        reply = `[ChatGPT] "${query}"에 대한 대답입니다. OpenAI ChatGPT 모델로 연결하려면 API 키를 입력하세요.`;
                    }
                }

                aiResponse.innerText = reply;
                speak(reply);
            }

           // Gemini API 호출 (230번 줄 아래에 작성)
async function fetchGeminiResponse(prompt, apiKey) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: prompt }]
                }]
            })
        });

        const data = await response.json();

        // 응답 상태가 정상(200번대)이 아닐 경우 에러 던지기
        if (!response.ok) {
            console.error("Gemini API 서버 에러:", data);
            throw new Error(data.error?.message || `상태 코드: ${response.status}`);
        }

        // 정상 응답 시 텍스트 반환
        return data.candidates[0].content.parts[0].text;
        
    } catch (error) {
        console.error("Gemini API 호출 중 오류:", error);
        return `[오류 발생] Gemini API 호출에 실패했습니다. (${error.message})`;
    }
}

            // ChatGPT API 호출
            async function fetchChatGPTResponse(prompt, key) {
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                const data = await res.json();
                return data.choices[0].message.content;
            }

            // 음성 출력 (TTS)
            function speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }
    </script>
</body>
</html>
