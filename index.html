<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .model-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .model-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .model-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .model-btn.active {
            background: white;
            color: #667eea;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 15px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .ai-name {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            margin-left: 18px;
        }

        .input-area {
            padding: 20px 25px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #messageInput::placeholder {
            color: #999;
        }

        .send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: loading 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        .scroll-to-bottom {
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .model-selector {
                flex-direction: column;
            }

            .model-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 채팅</h1>
            <div class="model-selector">
                <button class="model-btn active" data-model="claude">Claude</button>
                <button class="model-btn" data-model="gpt4">GPT-4</button>
                <button class="model-btn" data-model="gemini">Gemini</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <p>💬 AI와 대화를 시작해보세요!</p>
                    <p style="font-size: 12px;">모델을 선택하고 메시지를 입력하세요.</p>
                </div>
            </div>
            <div class="scroll-to-bottom"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="메시지를 입력하세요..." 
                    autocomplete="off"
                />
                <button class="send-btn" id="sendBtn">전송</button>
            </div>
        </div>
    </div>

    <script>
        const models = {
            claude: { name: 'Claude (Anthropic)', color: '#667eea' },
            gpt4: { name: 'GPT-4 (OpenAI)', color: '#10a37f' },
            gemini: { name: 'Gemini (Google)', color: '#1f2937' }
        };

        let currentModel = 'claude';
        let isLoading = false;

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelBtns = document.querySelectorAll('.model-btn');

        // 모델 선택
        modelBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modelBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentModel = btn.dataset.model;
            });
        });

        // 메시지 전송
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isLoading) return;

            // 사용자 메시지 추가
            addMessage(text, 'user');
            messageInput.value = '';
            isLoading = true;
            sendBtn.disabled = true;

            // AI 응답 생성 (시뮬레이션)
            setTimeout(() => {
                const response = generateAIResponse(text);
                addMessage(response, 'ai');
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }, 800 + Math.random() * 1200);
        }

        // 메시지 추가
        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('messages');
            
            // 빈 상태 제거
            if (messagesDiv.querySelector('.empty-state')) {
                messagesDiv.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            if (sender === 'ai') {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'ai-name';
                nameDiv.textContent = models[currentModel].name;
                messagesDiv.appendChild(nameDiv);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);

            // 스크롤 맨 아래로
            messagesDiv.parentElement.scrollTop = messagesDiv.parentElement.scrollHeight;
        }

        // AI 응답 생성 (데모용)
        function generateAIResponse(userMessage) {
            const responses = {
                claude: [
                    `안녕하세요! Claude입니다. 당신의 질문 "${userMessage}"에 대해 생각해보니, 이것은 매우 흥미로운 주제네요. 더 자세히 알려주시면 더 도움이 될 것 같습니다.`,
                    `흥미로운 질문입니다! "${userMessage}"에 대해 제 생각을 나누자면, 여러 관점에서 접근해볼 수 있습니다.`,
                    `좋은 질문입니다. "${userMessage}"은 실제로 여러 차원에서 생각해볼 수 있는 주제입니다.`
                ],
                gpt4: [
                    `그 질문 정말 좋습니다! "${userMessage}"에 대해 답변하자면, 이는 다양한 관점에서 살펴볼 수 있습니다.`,
                    `"${userMessage}"에 관해 물어봐주셨군요. 이 주제는 현대 사회에서 매우 중요한 이슈입니다.`,
                    `흥미로운 질문이네요. "${userMessage}"라는 주제를 분석해보면 여러 가지 중요한 포인트가 있습니다.`
                ],
                gemini: [
                    `안녕하세요! Gemini입니다. "${userMessage}"이라는 좋은 질문을 해주셨군요. 이에 대해 제 견해를 말씀드리겠습니다.`,
                    `"${userMessage}"에 대해 생각해보니, 이것은 정말 흥미로운 질문입니다. 여러 측면에서 살펴봐야 할 것 같습니다.`,
                    `좋은 질문입니다! "${userMessage}"에 대해 제 관점에서 보면, 이 문제는 다양한 해결책이 있을 수 있습니다.`
                ]
            };

            const modelResponses = responses[currentModel];
            return modelResponses[Math.floor(Math.random() * modelResponses.length)];
        }

        // 이벤트 리스너
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 초기 포커스
        messageInput.focus();
    </script>
    <!-- 음성 대화 버튼 HTML -->
<button id="voiceBtn" class="voice-btn">🎤 음성으로 찾기</button>

<!-- 음성 대화 버튼 스타일 (CSS) -->
<style>
.voice-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: #1769e0;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 9999;
    transition: all 0.3s ease;
}

.voice-btn:hover {
    background-color: #0f4eb3;
    transform: translateY(-3px);
}

/* 마이크 작동 중일 때 나타나는 애니메이션 효과 */
.voice-btn.recording {
    background-color: #e74c3c;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
}
</style>

<!-- 음성 인식 기능 (JavaScript) -->
<script>
const voiceBtn = document.getElementById('voiceBtn');

// 브라우저의 Web Speech API 지원 여부 확인
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    let isRecording = false;

    // 실시간 및 연속 인식 설정
    recognition.lang = 'ko-KR';
    recognition.continuous = true;     // 연속 수신
    recognition.interimResults = true; // 실시간 즉시 인식

    voiceBtn.addEventListener('click', () => {
        if (!isRecording) {
            try {
                recognition.start();
                isRecording = true;
                voiceBtn.textContent = '🎙️ 듣고 있는 중...';
                voiceBtn.classList.add('recording');
            } catch (e) {
                console.error(e);
            }
        } else {
            stopRecognition();
        }
    });

    // 음성 인식 처리
    recognition.onresult = (event) => {
        let transcript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }

        // 검색창에 실시간 표시
        searchInput.value = transcript;

        // 문장이 최종 완료되었을 때 즉시 대답 및 검색 실행
        if (event.results[event.results.length - 1].isFinal) {
            const query = transcript.trim();
            
            // AI 음성 안내 대답
            speakResponse(`${query} (으)로 검색합니다.`);
            
            // 검색 함수 실행 (함수명이 다를 경우 해당 함수명으로 변경)
            if (typeof searchJobs === 'function') {
                searchJobs();
            }
            
            stopRecognition();
        }
    };

    recognition.onerror = (event) => {
        console.error('음성 인식 오류:', event.error);
        resetBtn();
    };

    // 음성이 중간에 끊기더라도 수신 상태 유지
    recognition.onend = () => {
        if (isRecording) {
            recognition.start();
        } else {
            resetBtn();
        }
    };

    function stopRecognition() {
        isRecording = false;
        recognition.stop();
        resetBtn();
    }

    function resetBtn() {
        voiceBtn.textContent = '🎤 음성으로 찾기';
        voiceBtn.classList.remove('recording');
    }

    // AI 음성 대답 (TTS) 출력 함수
    function speakResponse(text) {
        window.speechSynthesis.cancel(); // 이전 음성 즉시 중단
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
} else {
    voiceBtn.addEventListener('click', () => {
        alert("현재 사용 중인 브라우저에서는 음성 인식을 지원하지 않습니다. (Chrome, Edge 권장)");
    });
}
}
</script>
</body>
</html>
